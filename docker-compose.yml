services:
  mongo:
    image: mongo:7
    container_name: inventory-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo --quiet --eval "
      try {
        rs.status();
      } catch (e) {
        rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
      }
      "

  api:
    build: ./backend
    container_name: inventory-api
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/inventory_supply_chain?replicaSet=rs0
      FRONTEND_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-SupplyChain Pro <no-reply@supplychainpro.local>}
      AGENTS_SERVICE_URL: http://agents:4000
      AGENTS_INTERNAL_API_KEY: ${AGENTS_INTERNAL_API_KEY:-dev-internal-agents-key}
    volumes:
      - ./backend:/app
      - /app/node_modules

  agents:
    build: ./agents
    container_name: inventory-agents
    depends_on:
      - api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      AGENTS_INTERNAL_API_KEY: ${AGENTS_INTERNAL_API_KEY:-dev-internal-agents-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_ADVISORY: ${GEMINI_API_KEY_ADVISORY:-}
      GEMINI_API_KEY_ANALYTICS: ${GEMINI_API_KEY_ANALYTICS:-}
      GEMINI_API_KEY_PROCUREMENT: ${GEMINI_API_KEY_PROCUREMENT:-}
      API_BASE_URL: http://api:5000/api/v1
      AGENTS_READONLY_EMAIL: ${AGENTS_READONLY_EMAIL:-agents-readonly@internal.local}
      AGENTS_READONLY_PASSWORD: ${AGENTS_READONLY_PASSWORD:-}
      AGENTS_PROCUREMENT_EMAIL: ${AGENTS_PROCUREMENT_EMAIL:-agents-procurement@internal.local}
      AGENTS_PROCUREMENT_PASSWORD: ${AGENTS_PROCUREMENT_PASSWORD:-}
    volumes:
      - ./agents:/app
      - /app/node_modules

volumes:
  mongo-data:
